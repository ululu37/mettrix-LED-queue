<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logger Config Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <div class="app-container">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-server pulse-icon"></i>
                <h1>Config Server</h1>
            </div>
            <div class="stats">
                <div class="stat-card total">
                    <div class="stat-icon"><i class="fa-solid fa-cubes"></i></div>
                    <div class="stat-info">
                        <h3>Total Devices</h3>
                        <div class="value" id="totalCount">0</div>
                    </div>
                </div>
                <div class="stat-card online">
                    <div class="stat-icon"><i class="fa-solid fa-wifi"></i></div>
                    <div class="stat-info">
                        <h3>Online</h3>
                        <div class="value" id="onlineCount">0</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="main-content">
            <div class="controls">
                <h2><i class="fa-solid fa-list-ul"></i> Connected Loggers</h2>
                <button class="btn btn-refresh" id="refreshBtn">
                    <i class="fa-solid fa-rotate-right"></i> Refresh
                </button>
            </div>

            <div class="devices-grid" id="devicesGrid">
                <!-- Devices will be populated here by JS -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Loading devices...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
